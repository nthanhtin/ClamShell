name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Set release version
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Use a version tag such as v0.1.1.'
            exit 1
          fi
          plutil -replace CFBundleShortVersionString -string "${RELEASE_TAG#v}" Info.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" Info.plist

      - name: Test
        run: bash test.sh

      - name: Build and package
        env:
          CLAMSHELL_SIGNING_IDENTITY: '-'
        run: |
          bash build.sh
          lipo build/ClamShell.app/Contents/MacOS/ClamShell -verify_arch arm64
          ditto -c -k --sequesterRsrc --keepParent build/ClamShell.app "build/ClamShell-${RELEASE_TAG}-arm64.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" "build/ClamShell-${RELEASE_TAG}-arm64.zip" \
            --verify-tag --title "ClamShell $RELEASE_TAG" --generate-notes \
            --notes-file .github/release-notes.md

  update-homebrew:
    needs: release
    runs-on: macos-15
    timeout-minutes: 5
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Update Homebrew cask
        run: |
          gh release download "$RELEASE_TAG" --pattern "ClamShell-${RELEASE_TAG}-arm64.zip" --dir "$RUNNER_TEMP"
          ruby Tools/update-cask.rb "$RELEASE_TAG" "$RUNNER_TEMP/ClamShell-${RELEASE_TAG}-arm64.zip" Casks/clamshell.rb
          git add Casks/clamshell.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Homebrew cask to $RELEASE_TAG"
          git pull --rebase origin main
          git push origin HEAD:main
